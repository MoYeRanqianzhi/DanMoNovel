<!-- 天青的花笺：右下角一朵卷云（"雨过天青云破处"）。云身是极淡的天青色，卷纹用略深的青灰线勾出 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <g opacity="0.3">
    <g fill="#bcd5df">
      <circle cx="184" cy="186" r="22"/>
      <circle cx="214" cy="172" r="16"/>
      <circle cx="156" cy="196" r="13"/>
      <circle cx="232" cy="194" r="14"/>
      <path d="M142 210C170 214 204 214 246 206V196H142Z"/>
    </g>
    <g fill="none" stroke="#7fa3b3" stroke-width="1.4" stroke-linecap="round">
      <!-- 三朵云头：外圈留一道口，里面一圈卷进去 -->
      <path d="M164 196A22 22 0 1 1 196 205"/>
      <path d="M175 192A13 13 0 1 1 191 196A6 6 0 1 1 183 189"/>
      <path d="M201 181A16 16 0 1 1 226 184"/>
      <path d="M209 176A8 8 0 1 1 219 179"/>
      <path d="M146 204A13 13 0 1 1 168 200"/>
      <path d="M151 198A6.5 6.5 0 1 1 161 197"/>
      <!-- 云脚与拖出去的云尾，末端再打一个小卷 -->
      <path d="M142 210C170 214 204 214 246 206"/>
      <path d="M146 210C122 214 100 208 86 198C76 190 80 180 90 182C97 184 97 191 92 193"/>
    </g>
  </g>
</svg>
