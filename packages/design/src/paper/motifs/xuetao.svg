<!-- 薛涛笺的花笺：一枝从右下角探进来的花。薛涛笺是唐代薛涛在浣花溪边用芙蓉花汁染成的小笺，所以配花枝。
     颜色为这套配色专门调过（枝叶取偏灰的豆沙色，花取柔和的玫瑰色），整体透明度压得很低，只在纸面上留一层淡影 -->
