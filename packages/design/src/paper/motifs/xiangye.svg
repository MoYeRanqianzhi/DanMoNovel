<!-- 缃叶的花笺：左下角三片落下的银杏叶。缃是浅黄色，缃叶就是泛黄的叶子；叶片金黄、叶脉略深 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <!-- 一片银杏叶：叶柄在原点，扇形的叶片朝上，外缘正中一道浅缺口 -->
    <path id="b" d="M0 0C-10-6-22-14-29-25C-27-33-17-40-5-39L0-33L5-39C17-40 27-33 29-25C22-14 10-6 0 0Z"/>
    <path id="v" d="M0-2L-21-29M0-2L-13-36M0-2L-4.5-37M0-2L4.5-37M0-2L13-36M0-2L21-29"/>
    <path id="t" d="M0 0C1 8 3 16 7 24"/>
    <g id="leaf">
      <use href="#b" fill="#d9ab4f"/>
      <use href="#v" fill="none" stroke="#b38530" stroke-width="0.55"/>
      <use href="#t" fill="none" stroke="#a87c31" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>
  <g opacity="0.3">
    <use href="#leaf" transform="translate(62 196) rotate(-22) scale(1.3)"/>
    <use href="#leaf" transform="translate(130 214) rotate(38) scale(0.9)"/>
    <use href="#leaf" transform="translate(26 138) rotate(-58) scale(0.62)"/>
  </g>
</svg>
